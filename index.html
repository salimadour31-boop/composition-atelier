<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Composition Atelier</title>
<style>
:root {
  --bg: #1a1a1a;
  --fg: #f0f0f0;
  --accent: #4a9eff;
  --panel: #2a2a2a;
  --border: #444;
}
body.light {
  --bg: #f5f5f5;
  --fg: #222;
  --accent: #0066cc;
  --panel: #fff;
  --border: #ddd;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  padding: 1rem;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
}
h1 { margin: 0; font-size: 1.5rem; }
.lang-switch { display: flex; gap: 0.5rem; }
.lang-switch button {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--fg);
  padding: 0.3rem 0.6rem;
  border-radius: 4px;
  cursor: pointer;
}
.lang-switch button.active { background: var(--accent); color: white; border-color: var(--accent); }
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 1rem;
  gap: 1rem;
}
@media (min-width: 800px) {
  main { flex-direction: row; }
}
.controls {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem;
  min-width: 280px;
  max-width: 320px;
}
.canvas-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}
#canvas {
  max-width: 100%;
  max-height: 70vh;
  border: 1px solid var(--border);
  background: #000;
  cursor: crosshair;
}
.drop-zone {
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 2rem;
  text-align: center;
  margin-bottom: 1rem;
  transition: border-color 0.2s;
}
.drop-zone.dragover { border-color: var(--accent); }
label { display: block; margin: 0.5rem 0 0.2rem; font-weight: 500; }
input[type="range"] { width: 100%; }
select, input[type="color"], button {
  width: 100%;
  padding: 0.5rem;
  margin: 0.3rem 0;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg);
  color: var(--fg);
}
button.primary {
  background: var(--accent);
  color: white;
  border: none;
  font-weight: 600;
  cursor: pointer;
}
button.primary:hover { opacity: 0.9; }
.guides label { display: flex; align-items: center; gap: 0.5rem; font-weight: normal; margin: 0.3rem 0; }
.guides input { width: auto; }
footer {
  padding: 1rem;
  text-align: center;
  font-size: 0.85rem;
  opacity: 0.7;
  border-top: 1px solid var(--border);
}
</style>
</head>
<body>
<header>
  <h1 id="title">Composition Atelier</h1>
  <div class="lang-switch">
    <button data-lang="fr" class="active">FR</button>
    <button data-lang="en">EN</button>
    <button data-lang="tzm">TZM</button>
  </div>
  <button id="theme-toggle" style="width:auto;padding:0.3rem 0.6rem;">🌙</button>
</header>
<main>
  <div class="controls">
    <div class="drop-zone" id="drop-zone">
      <p id="drop-text">Glissez une image ici ou cliquez pour choisir</p>
      <input type="file" id="file-input" accept="image/*" style="display:none">
      <button id="choose-btn">Choisir une image</button>
    </div>
    <div class="guides">
      <label><input type="checkbox" id="thirds" checked> <span id="lbl-thirds">Règle des tiers</span></label>
      <label><input type="checkbox" id="golden"> <span id="lbl-golden">Nombre d'or</span></label>
      <label><input type="checkbox" id="center"> <span id="lbl-center">Centre</span></label>
      <label><input type="checkbox" id="diagonals"> <span id="lbl-diagonals">Diagonales</span></label>
      <label><input type="checkbox" id="phi"> <span id="lbl-phi">Grille Phi</span></label>
    </div>
    <label id="lbl-opacity">Opacité des lignes</label>
    <input type="range" id="opacity" min="0" max="1" step="0.05" value="0.8">
    <label id="lbl-color">Couleur des lignes</label>
    <input type="color" id="line-color" value="#ffffff">
    <label id="lbl-thickness">Épaisseur</label>
    <input type="range" id="thickness" min="1" max="8" value="2">
    <button class="primary" id="export-btn">Exporter PNG avec guides</button>
    <button id="export-clean">Exporter sans guides</button>
  </div>
  <div class="canvas-container">
    <canvas id="canvas"></canvas>
    <p id="info"></p>
  </div>
</main>
<footer>
  <p>Outil libre MIT · 100 % navigateur · Aucune donnée envoyée</p>
</footer>
<script>
const translations = {
  fr: {
    title: "Composition Atelier",
    drop: "Glissez une image ici ou cliquez pour choisir",
    choose: "Choisir une image",
    thirds: "Règle des tiers",
    golden: "Nombre d'or",
    center: "Centre",
    diagonals: "Diagonales",
    phi: "Grille Phi",
    opacity: "Opacité des lignes",
    color: "Couleur des lignes",
    thickness: "Épaisseur",
    export: "Exporter PNG avec guides",
    exportClean: "Exporter sans guides",
    info: "Aucune image chargée"
  },
  en: {
    title: "Composition Atelier",
    drop: "Drag an image here or click to choose",
    choose: "Choose an image",
    thirds: "Rule of thirds",
    golden: "Golden ratio",
    center: "Center",
    diagonals: "Diagonals",
    phi: "Phi grid",
    opacity: "Line opacity",
    color: "Line color",
    thickness: "Thickness",
    export: "Export PNG with guides",
    exportClean: "Export without guides",
    info: "No image loaded"
  },
  tzm: {
    title: "Atelier n composition",
    drop: "Sers tawlaft da neɣ ssed",
    choose: "Fren tawlaft",
    thirds: "Tarrayt n kraḍ",
    golden: "Amḍan n wureɣ",
    center: "Ammas",
    diagonals: "Tidiwin",
    phi: "Aglam Phi",
    opacity: "Tizɣelt n izirigen",
    color: "Ini n izirigen",
    thickness: "Tizɣelt",
    export: "Ssufeg PNG s izirigen",
    exportClean: "Ssufeg war izirigen",
    info: "Ulac tawlaft"
  }
};

let currentLang = "fr";
let image = null;
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function setLang(lang) {
  currentLang = lang;
  const t = translations[lang];
  document.getElementById("title").textContent = t.title;
  document.getElementById("drop-text").textContent = t.drop;
  document.getElementById("choose-btn").textContent = t.choose;
  document.getElementById("lbl-thirds").textContent = t.thirds;
  document.getElementById("lbl-golden").textContent = t.golden;
  document.getElementById("lbl-center").textContent = t.center;
  document.getElementById("lbl-diagonals").textContent = t.diagonals;
  document.getElementById("lbl-phi").textContent = t.phi;
  document.getElementById("lbl-opacity").textContent = t.opacity;
  document.getElementById("lbl-color").textContent = t.color;
  document.getElementById("lbl-thickness").textContent = t.thickness;
  document.getElementById("export-btn").textContent = t.export;
  document.getElementById("export-clean").textContent = t.exportClean;
  document.querySelectorAll(".lang-switch button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
  updateInfo();
  draw();
}

document.querySelectorAll(".lang-switch button").forEach(btn => {
  btn.addEventListener("click", () => setLang(btn.dataset.lang));
});

document.getElementById("theme-toggle").addEventListener("click", () => {
  document.body.classList.toggle("light");
  document.getElementById("theme-toggle").textContent = document.body.classList.contains("light") ? "☀️" : "🌙";
});

function loadImage(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    image = img;
    resizeCanvas();
    draw();
    URL.revokeObjectURL(url);
    updateInfo();
  };
  img.src = url;
}

document.getElementById("choose-btn").addEventListener("click", () => document.getElementById("file-input").click());
document.getElementById("file-input").addEventListener("change", e => {
  if (e.target.files[0]) loadImage(e.target.files[0]);
});

const dropZone = document.getElementById("drop-zone");
dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
});

function resizeCanvas() {
  if (!image) return;
  const maxW = canvas.parentElement.clientWidth - 20;
  const maxH = window.innerHeight * 0.65;
  let w = image.width;
  let h = image.height;
  const ratio = Math.min(maxW / w, maxH / h, 1);
  canvas.width = Math.floor(w * ratio);
  canvas.height = Math.floor(h * ratio);
}

function drawGuides() {
  if (!image) return;
  const w = canvas.width;
  const h = canvas.height;
  const opacity = parseFloat(document.getElementById("opacity").value);
  const color = document.getElementById("line-color").value;
  const thick = parseInt(document.getElementById("thickness").value);
  ctx.save();
  ctx.strokeStyle = color;
  ctx.globalAlpha = opacity;
  ctx.lineWidth = thick;

  if (document.getElementById("thirds").checked) {
    ctx.beginPath();
    for (let i = 1; i <= 2; i++) {
      ctx.moveTo(w * i / 3, 0); ctx.lineTo(w * i / 3, h);
      ctx.moveTo(0, h * i / 3); ctx.lineTo(w, h * i / 3);
    }
    ctx.stroke();
  }
  if (document.getElementById("golden").checked || document.getElementById("phi").checked) {
    const phi = 1.618;
    const x1 = w / phi;
    const x2 = w - x1;
    const y1 = h / phi;
    const y2 = h - y1;
    ctx.beginPath();
    ctx.moveTo(x1, 0); ctx.lineTo(x1, h);
    ctx.moveTo(x2, 0); ctx.lineTo(x2, h);
    ctx.moveTo(0, y1); ctx.lineTo(w, y1);
    ctx.moveTo(0, y2); ctx.lineTo(w, y2);
    ctx.stroke();
  }
  if (document.getElementById("center").checked) {
    ctx.beginPath();
    ctx.moveTo(w/2, 0); ctx.lineTo(w/2, h);
    ctx.moveTo(0, h/2); ctx.lineTo(w, h/2);
    ctx.stroke();
  }
  if (document.getElementById("diagonals").checked) {
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(w, h);
    ctx.moveTo(w, 0); ctx.lineTo(0, h);
    ctx.stroke();
  }
  ctx.restore();
}

function draw() {
  if (!image) {
    canvas.width = 400;
    canvas.height = 300;
    ctx.fillStyle = "#111";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#666";
    ctx.font = "16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(translations[currentLang].info, canvas.width/2, canvas.height/2);
    return;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
  drawGuides();
}

function updateInfo() {
  const info = document.getElementById("info");
  if (!image) {
    info.textContent = translations[currentLang].info;
  } else {
    info.textContent = `${image.width} × ${image.height} px`;
  }
}

document.querySelectorAll(".guides input, #opacity, #line-color, #thickness").forEach(el => {
  el.addEventListener("input", draw);
});

document.getElementById("export-btn").addEventListener("click", () => {
  if (!image) return alert("Chargez d'abord une image");
  const a = document.createElement("a");
  a.download = "composition-guides.png";
  a.href = canvas.toDataURL("image/png");
  a.click();
});

document.getElementById("export-clean").addEventListener("click", () => {
  if (!image) return alert("Chargez d'abord une image");
  const temp = document.createElement("canvas");
  temp.width = canvas.width;
  temp.height = canvas.height;
  const tctx = temp.getContext("2d");
  tctx.drawImage(image, 0, 0, temp.width, temp.height);
  const a = document.createElement("a");
  a.download = "composition-clean.png";
  a.href = temp.toDataURL("image/png");
  a.click();
});

window.addEventListener("resize", () => { if (image) { resizeCanvas(); draw(); } });
setLang("fr");
</script>
</body>
</html>
